name: van_sale
description: "ZatGo VanSale — route sales with SQLite offline and safe sync."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  printing: ^5.14.2
  pdf: ^3.12.0
  # Keep 11.x while Flutter apps use android.builtInKotlin=false (share_plus 13
  # skips KGP on AGP 9 and then fails to compile Kotlin under the opt-out).
  share_plus: ^11.1.0
  excel: ^4.0.6
  file_picker: ^8.1.7
  geolocator: ^13.0.2
  mobile_scanner: ^7.0.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  zatgo_dart_sdk:
    path: ../../SharedSDK/dart_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/zatgo_vansale_logo.png"
